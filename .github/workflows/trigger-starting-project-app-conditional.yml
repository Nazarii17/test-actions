name: Starting Project APP Conditional CI Trigger

env:
  APP_DIR: './starting-project-conditional'
  ARTIFACT_NAME: 'dist-files-starting-project-conditional'

on:
  push:
    branches:
      - main
    paths:
      - 'starting-project-conditional/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Run Lint Action
        uses: ./starting-project-conditional/.github/actions/lint
        with:
          working-directory: ${{ env.APP_DIR }}


  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Run Test Action
        uses: ./starting-project-conditional/.github/actions/test
        with:
          working-directory: ${{ env.APP_DIR }}

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.build.outputs.script-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Run Build Action
        id: build
        uses: ./starting-project-conditional/.github/actions/build
        with:
          working-directory: ${{ env.APP_DIR }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
