name: Reusable Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'The directory of the app'
        required: true
        type: string
      artifact-name:
        description: 'Name of the downloaded artifact'
        required: true
        type: string
      script-file:
        description: 'Built JS asset filename (relative to dist)'
        required: true
        type: string
    secrets:
      dummy-secret:
        required: false
        description: "Dummy secret for testing purposes"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist

      - name: Verify artifact contents
        run: |
          echo "Artifact contents:"
          ls -R dist
        working-directory: ${{ inputs.working-directory }}

      - name: Deploy
        run: |
          echo "Deploying JS file: dist/${{ inputs.script-file }}"
        working-directory: ${{ inputs.working-directory }}