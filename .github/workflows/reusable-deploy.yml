name: Reusable Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'The directory of the app'
        required: true
        type: string
      artifact-name:
        description: 'Name of the downloaded artifact'
        required: true
        type: string
      script-file:
        description: 'Built JS asset filename (relative to dist)'
        required: true
        type: string
    outputs:
      result:
        description: 'Result of the deploy action'
        value: ${{ jobs.deploy.outputs.outcome }}
    secrets:
      dummy-secret:
        required: false
        description: "Dummy secret for testing purposes"

jobs:
  deploy:
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }}
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist

      - name: Verify artifact contents
        run: |
          echo "Artifact contents:"
          ls -R dist
        working-directory: ${{ inputs.working-directory }}

      - name: Deploy site
        uses: ./.github/actions/deploy-s3-javascript
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          bucket: 'some-bucket'
          dist-folder: ./dist
          bucket-region: 'us-east-1'
#        run: |
#          echo "Deploying JS file: dist/${{ inputs.script-file }}"
#        working-directory: ${{ inputs.working-directory }}

      - name: Set result output
        id: set-result
        run: echo "::set-output name=step-result::success"