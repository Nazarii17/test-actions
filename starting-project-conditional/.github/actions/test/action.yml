name: 'Test Project'
description: 'Install dependencies, and run tests'

inputs:
  working-directory:
    description: 'The directory of the app'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: ./.github/actions/cached-deps
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Test code
      id: run-tests
      run: npm run test
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Upload test report
      if: ${{ failure() && steps.run-tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: ${{ inputs.working-directory }}/test.json
