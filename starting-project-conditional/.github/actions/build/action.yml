name: 'Build Project'
description: 'Install dependencies and build the application'

inputs:
  working-directory:
    description: 'The directory of the app'
    required: true
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: true

outputs:
  script-file:
    description: 'Built JS asset filename'
    value: ${{ steps.publish.outputs.script-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: ./.github/actions/cached-deps
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Build website
      run: npm run build
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Publish JS filename
      id: publish
      run: |
        FILE=$(basename dist/assets/*.js | head -n 1)
        echo "script-file=assets/$FILE" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/dist

